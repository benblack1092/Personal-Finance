<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Finance</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <!-- Chart.js is vendored locally (static/vendor/) so the app makes no external
       network requests — everything, including the charting library, is on-device. -->
  <script src="/static/vendor/chart.umd.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">💰 Personal Finance</div>
    <nav class="tabs">
      <button class="tab active" data-view="dashboard">Dashboard</button>
      <button class="tab" data-view="transactions">Transactions</button>
      <button class="tab" data-view="import">Import</button>
      <button class="tab" data-view="rules">Categories &amp; Rules</button>
      <button class="tab" data-view="accounts">Accounts</button>
    </nav>
  </header>

  <main id="app">
    <!-- Views are rendered here by app.js -->
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="/static/app.js"></script>
</body>
</html>
